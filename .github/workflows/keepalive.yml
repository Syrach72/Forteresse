# Second déclencheur, indépendant de Vercel, pour que le projet Supabase gratuit
# ne soit pas mis en pause après une semaine d'inactivité (voir api/keepalive.js).
# Si l'appel échoue, GitHub envoie un e-mail : c'est l'alerte.
#
# GitHub désactive les workflows planifiés d'un dépôt public après 60 jours sans activité du dépôt
# (ses propres exécutions ne comptent pas). Quand plus personne ne publie de modification, le second
# travail ci-dessous crée donc lui-même un commit vide tous les ~40 jours : le planning reste actif
# sans intervention. (Le ping de Vercel, lui, n'en dépend pas.)
name: Maintenir Supabase actif

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler le point de maintien
        run: curl --fail --silent --show-error --retry 3 --retry-delay 15 "https://forteresse.vercel.app/api/keepalive?source=github"

  activite-depot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit vide si le dépôt est inactif depuis plus de 40 jours
        run: |
          derniere=$(git log -1 --format=%ct)
          maintenant=$(date +%s)
          if [ $((maintenant - derniere)) -gt $((40 * 86400)) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Maintien : activité du dépôt (le planning GitHub reste actif)"
            git push
          else
            echo "Dépôt actif récemment : rien à faire."
          fi
