# Second déclencheur, indépendant de Vercel, pour que le projet Supabase gratuit
# ne soit pas mis en pause après une semaine d'inactivité (voir api/keepalive.js).
# Si l'appel échoue, GitHub envoie un e-mail : c'est l'alerte.
name: Maintenir Supabase actif

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler le point de maintien
        run: curl --fail --silent --show-error --retry 3 --retry-delay 15 https://forteresse.vercel.app/api/keepalive
